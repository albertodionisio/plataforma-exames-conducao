name: Validar simulados

on:
  push:
    branches: [main]
    paths:
      - 'data/exames/**'
      - 'scripts/validar-exames.js'
      - '.github/workflows/validar-exames.yml'
  pull_request:
    paths:
      - 'data/exames/**'
      - 'scripts/validar-exames.js'
      - '.github/workflows/validar-exames.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Executar validador oficial
        run: node scripts/validar-exames.js
