name: Validar exames

on:
  push:
    branches: [main]
    paths:
      - 'data/exames/**'
      - 'scripts/validar-exames.js'
      - 'scripts/testar-assinaturas.js'
      - 'scripts/testar-fluxo.js'
      - 'scripts/build-netlify.js'
      - 'netlify.toml'
      - 'scripts/build-netlify.js'
      - 'netlify.toml'
      - 'styles-resultados.css'
      - 'app.js'
      - 'config.js'
      - 'public/assinaturas/planos.js'
      - '.github/workflows/validar-exames.yml'
  pull_request:
    paths:
      - 'data/exames/**'
      - 'scripts/validar-exames.js'
      - 'scripts/testar-assinaturas.js'
      - 'app.js'
      - 'config.js'
      - 'public/assinaturas/planos.js'
      - '.github/workflows/validar-exames.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar sintaxe JavaScript
        run: |
          node --check app.js
          node --check config.js
          node --check public/assinaturas/planos.js
      - name: Testar componente de assinaturas
        run: node scripts/testar-assinaturas.js
      - name: Testar fluxo completo dos exames
        run: node scripts/testar-fluxo.js
      - name: Executar validador oficial
        run: node scripts/validar-exames.js
      - name: Testar pacote de publicação Netlify
        run: node scripts/build-netlify.js
