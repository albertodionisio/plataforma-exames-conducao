name: Auditar PDF de sinais

on:
  push:
    branches:
      - feat/firebase-full-migration
    paths:
      - scripts/auditar-sinais-pdf.py
      - .github/workflows/auditar-sinais-pdf.yml
      - original/referencia/sinais.pdf
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renderizar-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          ref: feat/firebase-full-migration

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de auditoria
        run: python -m pip install --disable-pip-version-check PyMuPDF Pillow

      - name: Renderizar páginas e extrair sinais confirmados
        run: python scripts/auditar-sinais-pdf.py --dpi 160 --contact-dpi 100 --crop-dpi 600 --extract-vector-review

      - name: Publicar novos recortes no ramo de trabalho
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sinais/
          if git diff --cached --quiet; then
            echo "Nenhum recorte novo."
          else
            git commit -m "DADOS-079: extrair sinais confirmados do PDF a 600 DPI"
            git fetch origin feat/firebase-full-migration
            git rebase origin/feat/firebase-full-migration
            git push origin HEAD:feat/firebase-full-migration
          fi

      - name: Publicar material de revisão
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-pdf-sinais
          path: artifacts/sinais-pdf/
          if-no-files-found: error
          retention-days: 7
