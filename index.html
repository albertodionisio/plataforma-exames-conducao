  <script>
    (() => {
      const splash = document.getElementById("splash-abertura");
      if (!splash || !document.documentElement.classList.contains("splash-ativo")) {
        if (splash) splash.remove();
        document.documentElement.classList.remove("splash-ativo");
        return;
      }
      const inicio = Number(splash.dataset.inicio) || Date.now();
      const movimentoReduzido = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const duracao = movimentoReduzido ? 650 : 3400;
      const espera = Math.max(0, duracao - (Date.now() - inicio));
      window.setTimeout(() => {
        splash.classList.add("a-sair");
        document.documentElement.classList.remove("splash-ativo");
        window.setTimeout(() => splash.remove(), 360);
      }, espera);
    })();
  </script>
